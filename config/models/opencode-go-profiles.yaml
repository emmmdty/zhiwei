# 能力解析顺序（消除 probe 回写与 profile_digest 的循环依赖）：
#
#   effective_capability = static_profile 字段 ∪ 该 model 最新有效 attestation 的 probed 字段
#
# 本文件是**静态且不可变**的来源快照，probe 结果一律只落进 capability attestation，
# 绝不回写这里。否则每次 probe 都会改变 profile_digest，而 attestation 又绑定
# profile_digest，刚生成的 attestation 会立刻自我失效。
capability_resolution:
  order: [static_profile, latest_valid_attestation]
  attestation_wins_for_probed_fields: true
  probe_writes_back_into_this_file: false
  profile_digest_covers: static_profile_only
  gate_rule: >-
    Gate 对所需能力先查 effective_capability；仍为 null 时失败关闭。静态 profile
    为 null 但有 7 日内 attestation 覆盖该字段时，视为已解析。

formal_qualification:
  required_models: [deepseek-v4-flash, qwen3.6-plus, qwen3.7-plus, qwen3.7-max, gpt-5.6-luna]
  # 这里必须列全"正式 live 前仍未解析、且被 FactQA/Handoff 实际需要"的字段。
  # v1 只列了 max_input_tokens，漏掉了 structured_output / tool_choice——
  # 而 B0 与 A6 三档全是 Qwen，planner 必须读 structured_output，
  # 结果是 14 配置 live campaign 会在毫无预警的情况下整体失败关闭。
  unresolved_before_s1_live:
    - gpt-5.6-luna.max_input_tokens
    - gpt-5.6-luna.structured_output
    - gpt-5.6-luna.tool_choice
    - gpt-5.6-luna.reasoning_field
    - qwen3.6-plus.max_input_tokens
    - qwen3.6-plus.structured_output
    - qwen3.6-plus.tool_choice
    - qwen3.6-plus.reasoning_field
    - qwen3.7-plus.max_input_tokens
    - qwen3.7-plus.structured_output
    - qwen3.7-plus.tool_choice
    - qwen3.7-plus.reasoning_field
    - qwen3.7-max.max_input_tokens
    - qwen3.7-max.structured_output
    - qwen3.7-max.tool_choice
    - qwen3.7-max.reasoning_field
  required_capabilities_by_suite:
    factqa: [structured_output, max_input_tokens, max_output_tokens]
    handoff: [structured_output, max_input_tokens, max_output_tokens, reasoning_field]
  policy: >-
    Probe these fields into a capability attestation before formal live use; never infer
    them from context minus output, and never write probe results back into this file.
