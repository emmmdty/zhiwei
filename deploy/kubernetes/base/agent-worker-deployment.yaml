apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: zhiwei
  labels: {app: agent-worker, "app.kubernetes.io/name": zhiwei}
spec:
  replicas: 2
  selector: {matchLabels: {app: agent-worker}}
  template:
    metadata:
      labels: {app: agent-worker, "app.kubernetes.io/name": zhiwei}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent-worker
          image: zhiwei/app:local-product
          imagePullPolicy: IfNotPresent
          # worker 按 queue/trust/workload 扩展：本 deployment 承载 agent 队列，
          # 其余队列由独立 deployment/overlay 承载（specs/s11 §3）
          command: ["python", "-m", "zhiwei.workers.main", "agent"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          envFrom:
            - configMapRef: {name: zhiwei-endpoints}
          env:
            - name: ZHIWEI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: zhiwei-db, key: app-url}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            exec:
              command: ["python", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/ready').is_file() else 1)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/ready').is_file() else 1)"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - {name: tmp, emptyDir: {medium: Memory}}
