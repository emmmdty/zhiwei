# local-reference 端点 patch：外部占位名 → in-cluster 参考服务名。
apiVersion: v1
kind: ConfigMap
metadata:
  name: zhiwei-endpoints
  namespace: zhiwei-local
data:
  ZHIWEI_PROFILE: "local_product"
  ZHIWEI_RELEASE_MODE: "fixture_only"
  ZHIWEI_DATABASE_URL: "postgresql+asyncpg://zhiwei_app@postgres:5432/zhiwei"
  ZHIWEI_IDENTITY_DATABASE_URL: "postgresql+asyncpg://zhiwei_identity@postgres:5432/zhiwei_identity"
  ZHIWEI_TEMPORAL_TARGET: "temporal:7233"
  ZHIWEI_OPA_BASE_URL: "http://opa:8181"
  ZHIWEI_REDIS_URL: "redis://redis:6379/0"
  ZHIWEI_OIDC_ISSUER: "http://keycloak:8081/realms/zhiwei"
  ZHIWEI_OIDC_CLIENT_ID: "zhiwei-bff"
  ZHIWEI_OIDC_REDIRECT_URI: "http://localhost:8090/auth/callback"
  ZHIWEI_TEMPORAL_DBNAME: "zhiwei_temporal"
