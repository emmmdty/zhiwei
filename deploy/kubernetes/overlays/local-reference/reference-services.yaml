            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: zhiwei-local
  labels: {app: opa}
spec:
  selector: {app: opa}
  ports: [{port: 8181, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: zhiwei-local
  labels: {app: opa, "app.kubernetes.io/name": zhiwei-reference}
spec:
  replicas: 1
  selector: {matchLabels: {app: opa}}
  template:
    metadata:
      labels: {app: opa, "app.kubernetes.io/name": zhiwei-reference}
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:1.19.0-debug@sha256:ec3c7a29a21ce96d71231cb4befa2561205fe84e5a2dc3cc46ac7bc8bd21b3a4
          args: ["run", "--server", "--addr", "0.0.0.0:8181"]
          ports: [{containerPort: 8181}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 8181}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8181}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: zhiwei-local
  labels: {app: temporal}
spec:
  selector: {app: temporal}
  ports: [{port: 7233, name: grpc}]
---
# E-R1 方案 b：server:1.31.2 + admin-tools:1.31.2 schema setup（与 compose 侧
# profiles/temporal.yaml 同构；config 模板由 kustomization 的 configMapGenerator
# 直接引用 compose 侧单一事实源文件渲染，无副本漂移面）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: zhiwei-local
  labels: {app: temporal, "app.kubernetes.io/name": zhiwei-reference}
spec:
  replicas: 1
  selector: {matchLabels: {app: temporal}}
  template:
    metadata:
      labels: {app: temporal, "app.kubernetes.io/name": zhiwei-reference}
    spec:
      initContainers:
        - name: temporal-config-render
          image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
          command: ["sh", "-c", "mkdir -p /out && sed \"s/__ZHIWEI_PG_PASSWORD__/$POSTGRES_PWD/\" /in/development.yaml.template > /out/development.yaml && cp /in/dynamicconfig.yaml /out/dynamicconfig.yaml"]
          env:
            - {name: POSTGRES_PWD, value: zhiwei-dev-pg-only}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: config-template, mountPath: /in, readOnly: true}
            - {name: server-config, mountPath: /out}
        - name: temporal-schema-setup
          image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
          command:
            - sh
            - -c
            - |
              set -eu
              SQL="temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u zhiwei_temporal --pw $$POSTGRES_PWD"
              $$SQL --db zhiwei_temporal setup-schema -v 0.0
              $$SQL --db zhiwei_temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
              $$SQL --db temporal_visibility setup-schema -v 0.0
              $$SQL --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
          env:
            - {name: POSTGRES_PWD, value: zhiwei-dev-pg-only}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
      containers:
        - name: temporal
          image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
          # 镜像默认 entrypoint 是裸 `temporal-server start`——start 子命令不继承
          # 全局 env 默认值（回退 env-only 配置，Cassandra 零值报错），显式 --env。
          command: ["temporal-server", "--env", "development", "start"]
          ports: [{containerPort: 7233}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: server-config, mountPath: /etc/temporal/config, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 7233}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 7233}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: config-template
          configMap: {name: temporal-server-config}
        - name: server-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: zhiwei-local
  labels: {app: opensearch}
spec:
  selector: {app: opensearch}
  ports: [{port: 9200, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: zhiwei-local
  labels: {app: opensearch, "app.kubernetes.io/name": zhiwei-reference}
spec:
  replicas: 1
  selector: {matchLabels: {app: opensearch}}
  template:
    metadata:
      labels: {app: opensearch, "app.kubernetes.io/name": zhiwei-reference}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.2@sha256:69588c664014fa3d3260ed5dd337f8538fec94790dad00bfbe92301eaaaac240
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: 9200}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 9200}
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
