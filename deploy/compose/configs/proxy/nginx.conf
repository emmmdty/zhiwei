# S11 反向代理：唯一发布面。/api → API 容器，/ → web 静态。
# 非 root（compose user 101）+ 只读 rootfs：pid/temp/cache 全部落 tmpfs。
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;
  # 容器 DNS 动态解析（compose 服务名）
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    # TLS 监听（浏览器 OIDC 旅程）：__Host-+Secure 会话 cookie 要求 https 源；
    # dev 自签名证书由 proxy-tls-certgen 一次性生成（CN/SAN=keycloak.local），
    # 真实部署由 operator 换发正式证书（k8s reference 走 Ingress TLS）。
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    server_name _;

    # 探活：转发 API 元数据端点——发布面的 healthz 反映 API 健康（proxy 自身健康
    # 由容器 healthcheck 承载）
    location = /healthz {
      access_log off;
      set $upstream_api api;
      proxy_pass http://$upstream_api:8000;
      proxy_set_header Host $host:$server_port;
    }

    # OIDC 浏览器流经代理出口（issuer 与 redirect URI 的 keycloak.local:8090 对位）
    location /realms/ {
      set $upstream_keycloak keycloak;
      proxy_pass http://$upstream_keycloak:8080;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /resources/ {
      set $upstream_keycloak keycloak;
      proxy_pass http://$upstream_keycloak:8080;
      proxy_set_header Host $host:$server_port;
    }

    location /api/ {
      set $upstream_api api;
      proxy_pass http://$upstream_api:8000;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-For $remote_addr;
      # $scheme（非硬编码 http）：TLS 监听上浏览器源是 https，api 的 CSRF 门禁
      # 以 Origin == scheme://netloc 校验，硬编码会让所有 https mutation 403。
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # OIDC 浏览器旅程：/auth/login（302 → Keycloak authorize）与 /auth/callback
    # （会话 cookie 落地）都是 API 路由——必须显式路由，否则被 / 的 web 静态
    # fallback 承接，登录永远无法完成（ZHIWEI_OIDC_REDIRECT_URI 走 TLS 回环）。
    location /auth/ {
      set $upstream_api api;
      proxy_pass http://$upstream_api:8000;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # SSE 事件流（/api/v1/events 经上游也已关闭缓冲）
    location / {
      set $upstream_web web;
      proxy_pass http://$upstream_web:8080;
      proxy_set_header Host $host;
    }
  }
}
