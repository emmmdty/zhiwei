name: zhiwei-s0

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: zhiwei_test
      POSTGRES_USER: zhiwei_migrator
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiwei_migrator -d zhiwei_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./postgres/init-test-roles.sql:/docker-entrypoint-initdb.d/00-zhiwei-roles.sql:ro
      - zhiwei_s0_postgres:/var/lib/postgresql/data

  # S1-T2 identity profile：local-product OIDC IdP。测试只做静态校验与本地开发；
  # CI/测试进程不连接它（OIDC 契约测试用 MockTransport）。
  # 启动 Gate 是 tests/contract/deploy 的 docker 测试（真实拉起 + healthcheck），
  # `docker compose ... config --quiet` 只证明 YAML 可解析，不是启动 Gate。
  keycloak:
    profiles: ["identity"]
    # tag + manifest digest 双重 pin；digest 必须通过 registry manifest 校验
    # （docker manifest inspect），且可被 docker 拉取。
    image: quay.io/keycloak/keycloak:26.1@sha256:be6a86215213145bfb4fb3e2b3ab982a806d00262655abdcf3ffa6a38d241c7c
    entrypoint: ["/opt/keycloak/entrypoint.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-zhiwei-admin}"
      # 以下默认值只服务本地开发；任何真实部署必须由 operator 通过环境变量或
      # docker secret 覆盖，仓库不提交真实 key/client secret。
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-zhiwei-dev-admin-only}"
      KEYCLOAK_TEST_CLIENT_SECRET: "${KEYCLOAK_TEST_CLIENT_SECRET:-s1-dev-client-secret-only}"
      KEYCLOAK_TEST_USER_PASSWORD: "${KEYCLOAK_TEST_USER_PASSWORD:-s1-dev-user-password-only}"
    # 注意：Keycloak 绝不挂载 master key（验收阻断 4）。master key 只属于 ZhiWei
    # 应用进程；当前 compose 没有应用服务，应用容器挂载在 S11 实现，不为挂载制造
    # dummy service。entrypoint 只消费上面的测试凭据，与 /run/secrets 无关。
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro
      - ./keycloak/realm-template.json:/opt/keycloak/realm-template.json:ro
      - zhiwei_s0_keycloak:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 60

  # S1-T3 policy sidecar：授权判定走真实 OPA（RBAC/SoD 规则唯一事实实现）。
  # 固定镜像 1.19.0-debug（busybox sh，无 wget/curl）：entrypoint 只依赖 sh + opa
  # 自身；容器内无健康检查工具，就绪由集成测试轮询 /health?bundles 完成。
  # bundle 由 entrypoint 在启动前从 ./policies 构建并带固定 revision（构建失败
  # 容器即退出，fail closed）；revision 可经 OPA_BUNDLE_REVISION 覆盖（测试模拟
  # bundle 更新/policy update）。绝不挂载 master key。
  opa:
    profiles: ["identity"]
    # tag + manifest digest 双重 pin；digest 必须通过 registry manifest 校验
    image: openpolicyagent/opa:1.19.0-debug@sha256:ec3c7a29a21ce96d71231cb4befa2561205fe84e5a2dc3cc46ac7bc8bd21b3a4
    entrypoint: ["/bin/sh", "/opa-entrypoint/entrypoint.sh"]
    environment:
      # 默认值只服务本地开发/测试；真实部署由 operator 覆盖
      OPA_BUNDLE_REVISION: "${OPA_BUNDLE_REVISION-s1-t3-local}"  # 未设置才用默认；空值保留给 entrypoint fail closed
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./opa/entrypoint.sh:/opa-entrypoint/entrypoint.sh:ro
      - ../../policies:/policies:ro
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true

secrets:
  # 顶层 Docker-secret master-key 声明（key_id=base64 32 字节）；仓库里的文件是
  # 本地开发占位，真实部署必须由 operator 覆盖。当前 compose 没有任何服务挂载它：
  # master key 只应挂载给 ZhiWei 应用容器（S11 计划实现），绝不挂载给 Keycloak。
  zhiwei_identity_master_key:
    file: ./secrets/zhiwei_identity_master_key

volumes:
  zhiwei_s0_postgres:
  zhiwei_s0_keycloak:
