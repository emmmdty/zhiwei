            type: constant
            value: 100
      - path: src/version.py
        symbols:
          - name: VERSION
            type: constant
            value: "1.2.0"
      - path: src/knowledge/freshness.py
        symbols:
          - name: FreshnessPolicy
            type: class
            fields:
              - name: aging_threshold
                type: timedelta

  github:
    repository: zhiwei-core
    prs:
      - number: 42
        title: "Add ACL enforcement"
        reviews:
          - id: review-1
            body: "fail-closed semantics for unknown ACL state"
          - id: review-2
            body: "Need integration test for revoked ACL path"
      - number: 28
        title: "Fix memory leak in connection pool"
        body: "Resolved high memory usage after pool cleanup."
    issues:
      - number: 17
        title: "OpenSearch index rebuild strategy"
        body: "alias switch with zero-downtime rebuild"
    commits:
      - sha: abc1234
        message: "feat(contracts): add REVOKED state to SourceVersionState"
        diff_files: [src/knowledge/contracts.py]
    releases:
      - tag: v1.2.0-rc1
        version: "1.2.0-rc1"

  db:
    schemas:
      - name: public
        tables:
          - name: user_roles
            columns: [id, name, org_id, created_at]
            row_count: 7
          - name: query_log
            columns: [id, query, memory_bytes, timestamp]
    snapshot_level: replayable

# ---------------------------------------------------------------- ACL fixtures
acl:
  organizations:
    - id: org-a
      workspaces: [ws-a1, ws-a2]
    - id: org-b
      workspaces: [ws-b1]
  principals:
    - id: alice@org-a
      org: org-a
      clearance: INTERNAL
    - id: bob@org-b
      org: org-b
      clearance: CONFIDENTIAL
      revoked_at_query_time: true
  documents:
    - doc: doc-data-classification
      classification: CONFIDENTIAL
      allowed_principals: []  # nobody in test has CONFIDENTIAL

# ---------------------------------------------------------------- freshness fixtures
freshness:
  policies:
    - connector: files
      aging_threshold: 7d
    - connector: github
      aging_threshold: 30d
    - connector: db
      aging_threshold: 1d
  fixtures:
    - doc: doc-456
      observed_at: "2026-08-05T00:00:00Z"
      aging_threshold: 7d
      expected_status: aged
    - doc: doc-789
      observed_at: "2026-09-02T00:00:00Z"
      aging_threshold: 7d
      expected_status: fresh

# ---------------------------------------------------------------- metamorphic variants
metamorphic:
  rename:
    description: Source file renamed; locator URI changes but content stays the same.
  move:
    description: Source file moved to different directory; locator path changes.
  update:
    description: Content updated; ground truth must reflect new value.
  revoke:
    description: Source version revoked or ACL removed; query must be refused.

