            lines: [89, 153]
            fields:
              - name: content_digest
                validator: "sha256 prefix + 64 hex chars"
          - name: ACLSnapshot
            type: class
            lines: [61, 70]
          - name: Locator
            type: class
            lines: [41, 58]
      - path: src/knowledge/planner.py
        symbols:
          - name: KnowledgePlanner
            type: class
            methods:
              - name: plan
                lines: [1, 50]
              - name: generate_candidates
                lines: [51, 120]
        imports: [knowledge/contracts, knowledge/query, knowledge/acl, knowledge/freshness]
      - path: src/runtime/handlers/retrieve.py
        symbols:
          - name: RetrieveHandler
            type: class
        imports: [knowledge/planner, knowledge/contracts]
      - path: src/zhiwei/evals/domain.py
        symbols:
          - name: sorted_unique_units
            type: function
            lines: [74, 84]
      - path: src/config/constants.py
        symbols:
          - name: MAX_UPLOAD_SIZE
            type: constant
            value: 104857600
      - path: src/config/languages.py
        symbols:
          - name: LANGUAGES
            type: constant
            value: "[python, typescript, go, rust]"
      - path: src/config/pool.py
        symbols:
